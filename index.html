<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Авито-Финдер</title>
<style>
  :root{--bg:#0f1220;--card:#181c2e;--card2:#1f2438;--line:#2b3149;--text:#e9edfb;--muted:#98a0bd;
        --accent:#5ee08a;--warn:#ffb84d;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:70px}
  header{position:sticky;top:0;z-index:10;background:#0f1220;border-bottom:1px solid var(--line);padding:12px 14px 10px}
  h1{font-size:17px;margin:0 0 2px}
  .muted{color:var(--muted);font-size:12px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .controls .wide{grid-column:1/-1}
  select,input{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);
               border-radius:10px;padding:9px 10px;font-size:14px;outline:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);
        padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer}
  .chip.on{background:rgba(94,224,138,.14);border-color:rgba(94,224,138,.5);color:var(--accent)}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
          background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
  .toggle input{accent-color:var(--accent);width:auto}
  #stats{color:var(--muted);font-size:12px;margin-top:8px}
  main{padding:12px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{aspect-ratio:1/1;background:#0b0e18 center/cover no-repeat;position:relative;display:flex;
         align-items:center;justify-content:center;color:#3a4160;font-size:12px}
  .badge{position:absolute;top:8px;left:8px;background:rgba(10,12,20,.85);border-radius:8px;padding:3px 7px;font-size:12px;font-weight:600}
  .badge.good{color:var(--accent)} .badge.mid{color:var(--warn)} .badge.bad{color:var(--bad)}
  .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
  .title{font-size:13px;line-height:1.3;max-height:3.4em;overflow:hidden}
  .meta{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--muted);background:#141828;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .tag.fake{color:var(--warn);border-color:rgba(255,184,77,.35)}
  .price{font-size:16px;font-weight:700;margin-top:auto}
  .est{font-size:11px;color:var(--muted)}
  .est b{color:var(--text);font-weight:600}
  a{color:inherit;text-decoration:none}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  footer{position:fixed;bottom:0;left:0;right:0;background:#0f1220;border-top:1px solid var(--line);
         padding:8px 14px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Авито-Финдер <span class="muted" id="city"></span></h1>
  <div class="muted" id="updated"></div>

  <div class="controls">
    <input class="wide" id="q" type="search" placeholder="Поиск: бренд, вещь, слово">
    <select id="cityFilter"><option value="">Все города</option></select>
    <select id="cat"><option value="">Все категории</option></select>
    <select id="brand"><option value="">Все бренды</option></select>
    <select id="size"><option value="">Все размеры</option></select>
    <select id="sort">
      <option value="discount">Сначала выгодные</option>
      <option value="price">Сначала дешёвые</option>
      <option value="profit">Сначала прибыльные</option>
    </select>
    <input id="pmin" type="number" placeholder="Цена от" value="1000">
    <input id="pmax" type="number" placeholder="Цена до" value="20000">
  </div>

  <div class="chips" id="typeChips">
    <div class="chip on" data-type="all">Все</div>
    <div class="chip" data-type="orig">Оригинал</div>
    <div class="chip" data-type="fake">Паль</div>
  </div>

  <div class="row">
    <label class="toggle"><input type="checkbox" id="photoOnly" checked> только с фото</label>
    <label class="toggle"><input type="checkbox" id="newOnly"> только новое</label>
  </div>

  <div id="stats"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ничего не найдено — ослабь фильтры</div>
</main>

<footer>Оценка рынка — медиана похожих объявлений. Обновляется 3 раза в день.</footer>

const $ = function (id) { return document.getElementById(id); };
let stateType = 'all';

function median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function buildModel(items) {
  var byKey = new Map(), byCat = new Map(), all = [];
  items.forEach(function (it) {
    var type = it.fake ? 'fake' : 'orig';
    var k1 = it.category + '|' + it.brand + '|' + type;
    var k2 = it.category + '|' + type;
    if (!byKey.has(k1)) byKey.set(k1, []);
    byKey.get(k1).push(it.price);
    if (!byCat.has(k2)) byCat.set(k2, []);
    byCat.get(k2).push(it.price);
    all.push(it.price);
  });
  return { byKey: byKey, byCat: byCat, allMedian: median(all) };
}

function estimate(item, model) {
  var type = item.fake ? 'fake' : 'orig';
  var g1 = model.byKey.get(item.category + '|' + item.brand + '|' + type) || [];
  var g2 = model.byCat.get(item.category + '|' + type) || [];
  var market, basis;
  if (g1.length >= 3) { market = median(g1); basis = 'по ' + g1.length + ' похожим'; }
  else if (g2.length >= 3) { market = median(g2); basis = 'по категории'; }
  else { market = model.allMedian * (item.fake ? 0.6 : 1); basis = 'по всему рынку'; }

  return {
    market: Math.round(market),
    discount: market > 0 ? 1 - item.price / market : 0,
    profit: Math.round(market * 0.8 * 0.95 - item.price),
    basis: basis
  };
}

function fmt(n) { return n.toLocaleString('ru-RU') + ' ₽'; }

function fillSelect(el, values) {
  values.forEach(function (v) {
    var o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    el.appendChild(o);
  });
}

function cardOf(item, est) {
  var a = document.createElement('a');
  a.href = item.url || '#';
  a.target = '_blank';
  a.rel = 'noopener';

  var card = document.createElement('div');
  card.className = 'card';

  var thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (item.img) thumb.style.backgroundImage = "url('" + item.img + "')";
  else thumb.textContent = 'без фото';

  var d = Math.round(est.discount * 100);
  var badge = document.createElement('div');
  badge.className = 'badge ' + (d >= 40 ? 'good' : d >= 20 ? 'mid' : 'bad');
  badge.textContent = (d >= 0 ? '−' : '+') + Math.abs(d) + '% к рынку';
  thumb.appendChild(badge);

  var body = document.createElement('div');
  body.className = 'body';

  var title = document.createElement('div');
  title.className = 'title';
  title.textContent = item.title;

  var meta = document.createElement('div');
  meta.className = 'meta';
  [item.brand, item.size, item.fake ? 'паль' : '', item.condition === 'new' ? 'новое' : '', item.city]
    .forEach(function (t) {
      if (!t) return;
      var s = document.createElement('span');
      s.className = 'tag' + (t === 'паль' ? ' fake' : '');
      s.textContent = t;
      meta.appendChild(s);
    });

  var price = document.createElement('div');
  price.className = 'price';
  price.textContent = fmt(item.price);

  var estEl = document.createElement('div');
  estEl.className = 'est';
  estEl.innerHTML = 'рынок ≈ <b>' + fmt(est.market) + '</b><br>прибыль: <b style="color:' +
    (est.profit > 0 ? 'var(--accent)' : 'var(--bad)') + '">' + (est.profit > 0 ? '+' : '') + fmt(est.profit) +
    '</b><br><span style="opacity:.7">' + est.basis + '</span>';

  body.appendChild(title);
  body.appendChild(meta);
  body.appendChild(price);
  body.appendChild(estEl);
  card.appendChild(thumb);
  card.appendChild(body);
  a.appendChild(card);
  return a;
}

function apply() {
  var q = $('q').value.trim().toLowerCase();
  var city = $('cityFilter').value;
  var cat = $('cat').value, brand = $('brand').value, size = $('size').value;
  var pmin = +$('pmin').value || 0, pmax = +$('pmax').value || Infinity;
  var photoOnly = $('photoOnly').checked, newOnly = $('newOnly').checked;

  var model = buildModel(DATA.items);
  var list = DATA.items.map(function (it) { return { item: it, est: estimate(it, model) }; });

  list = list.filter(function (x) {
    var it = x.item;
    if (q && (it.title + ' ' + it.brand).toLowerCase().indexOf(q) < 0) return false;
    if (city && it.city !== city) return false;
    if (cat && it.category !== cat) return false;
    if (brand && it.brand !== brand) return false;
    if (size && it.size !== size) return false;
    if (it.price < pmin || it.price > pmax) return false;
    if (photoOnly && !it.img) return false;
    if (newOnly && it.condition !== 'new') return false;
    if (stateType === 'fake' && !it.fake) return false;
    if (stateType === 'orig' && it.fake) return false;
    return true;
  });

  var sort = $('sort').value;
  list.sort(function (a, b) {
    if (sort === 'price') return a.item.price - b.item.price;
    if (sort === 'profit') return b.est.profit - a.est.profit;
    return b.est.discount - a.est.discount;
  });

  var grid = $('grid');
  grid.textContent = '';
  list.forEach(function (x) { grid.appendChild(cardOf(x.item, x.est)); });

  var good = list.filter(function (x) { return x.est.discount >= 0.4; }).length;
  $('stats').textContent = 'Найдено: ' + list.length + ' · выгодных (≥40%): ' + good +
    ' · медиана рынка: ' + fmt(Math.round(model.allMedian));
  $('empty').hidden = list.length > 0;
}

function uniq(key) {
  var s = new Set();
  DATA.items.forEach(function (it) { if (it[key]) s.add(it[key]); });
  return Array.from(s).sort();
}

function init() {
  $('city').textContent = DATA.city || '';
  var dt = new Date(DATA.updated);
  $('updated').textContent = 'обновлено: ' + dt.toLocaleString('ru-RU') + ' · ' + DATA.items.length + ' объявлений';

  fillSelect($('cat'), uniq('category'));
  fillSelect($('brand'), uniq('brand'));
  fillSelect($('size'), uniq('size'));
  fillSelect($('cityFilter'), uniq('city'));

  ['q', 'cityFilter', 'cat', 'brand', 'size', 'sort', 'pmin', 'pmax', 'photoOnly', 'newOnly']
    .forEach(function (id) { $(id).addEventListener('input', apply); });

  Array.prototype.forEach.call(document.querySelectorAll('#typeChips .chip'), function (ch) {
    ch.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('#typeChips .chip'), function (c) { c.classList.remove('on'); });
      ch.classList.add('on');
      stateType = ch.dataset.type;
      apply();
    });
  });

  apply();
}

// при открытии пробуем взять свежие данные; если сети нет — остаёмся на вшитых
function startApp() {
  if (typeof fetch !== 'function' || location.protocol === 'file:') {
    init();
    return;
  }
  fetch('data.json?ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (fresh) {
      if (fresh && fresh.items && fresh.items.length) DATA = fresh;
    })
    .catch(function () { })
    .then(function () { init(); });
}

startApp();
</script>
