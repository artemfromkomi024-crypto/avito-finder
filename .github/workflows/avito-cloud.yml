name: Avito cloud update

# Бесплатная попытка обновить базу из облака. Каждый запуск — новый IP,
# поэтому часть попыток Авито блокирует, но удачные бесплатно пополняют data.json.

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-cloud
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Firefox
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps firefox

      - name: Parse, check photos, build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd parser
          python -u avito_parser.py --no-proxy || true
          python -u ai_authenticity.py --no-proxy --limit 20 || true
          python -u build_site.py
          cd ..
          cp Avito.html index.html

      - name: Commit changes
        run: |
          git config user.name "avito-cloud"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html Avito.html
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "cloud update $(date -u +%FT%TZ)"
          git pull --rebase origin main || { git rebase --abort || true; echo "конфликт, пропускаем"; exit 0; }
          git push
