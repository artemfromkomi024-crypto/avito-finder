name: Avito cloud update

# Бесплатная попытка обновить базу из облака. Каждый запуск — новый IP,
# поэтому часть попыток Авито блокирует, но удачные бесплатно пополняют data.json.
# Запросы идут по кругу (курсор в data.json), поэтому удачные попытки
# приходятся на разные города и категории, а не на одни и те же шорты.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-cloud
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Firefox
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps firefox

      - name: Parse, check photos, build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd parser
          python -u avito_parser.py --no-proxy || true
          python -u ai_authenticity.py --no-proxy --limit 20 || true
          python -u normalize_urls.py || true
          python -u build_site.py
          cd ..
          cp Avito.html index.html

      - name: Commit and push
        run: |
          git config user.name "avito-cloud"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data.json index.html Avito.html
            if git diff --cached --quiet; then
              echo "нет изменений"
              exit 0
            fi
            git commit -m "cloud update $(date -u +%FT%TZ)"
            if git push origin HEAD:main; then
              echo "опубликовано"
              exit 0
            fi
            echo "кто-то успел раньше — сливаем и пробуем снова (попытка $attempt)"
            cp data.json /tmp/ours.json
            git reset --soft HEAD~1
            git fetch origin main
            git checkout origin/main -- data.json
            python parser/merge_remote.py /tmp/ours.json
            python parser/build_site.py
            cp Avito.html index.html
          done
          echo "опубликовать не удалось, следующий запуск попробует снова"
          exit 0
