<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="description" content="Авито-Финдер — выгодные вещи с Авито: оценка рынка, скидка и проверка подлинности по фото.">
<meta property="og:type" content="website">
<meta property="og:title" content="Авито-Финдер">
<meta property="og:description" content="Выгодные вещи с Авито: оценка рынка, скидка и проверка подлинности.">
<title>Авито-Финдер</title>
<style>
  :root{
    --bg:#0a0c13; --card:#141827; --card2:#1b2033;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --text:#edf0fa; --muted:#8f97b1;
    --accent:#4ade80; --accent-dim:rgba(74,222,128,.14);
    --warn:#fbbf24; --bad:#f87171; --blue:#60a5fa;
    --radius:16px; --shadow:0 10px 28px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;color:var(--text);padding-bottom:64px;
    background:
      radial-gradient(900px 520px at 10% -14%, rgba(74,222,128,.10), transparent 60%),
      radial-gradient(820px 520px at 100% -4%, rgba(96,165,250,.09), transparent 55%),
      var(--bg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(74,222,128,.28)}
  header{
    position:sticky;top:0;z-index:20;padding:14px 16px 10px;
    background:rgba(10,12,19,.84);border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  h1{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;letter-spacing:-.25px;margin:0}
  h1::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);
             box-shadow:0 0 14px rgba(74,222,128,.85);flex:none}
  .muted{color:var(--muted);font-size:12px;font-weight:400}
  #updated{margin-top:3px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .controls .wide{grid-column:1/-1}
  select,input{
    width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);
    border-radius:11px;padding:9px 11px;font-size:14px;outline:none;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  select:hover,input:hover{border-color:var(--line2)}
  select:focus,input:focus{border-color:rgba(74,222,128,.55);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
  input[type=search]{-webkit-appearance:none}
  .chips{
    display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;
    scrollbar-width:none;-ms-overflow-style:none;
    mask-image:linear-gradient(90deg,#000 92%,transparent);
    -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);
    padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none;
    font:inherit;font-size:13px;appearance:none;-webkit-appearance:none;
    transition:color .15s ease,border-color .15s ease,background .15s ease;
  }
  .chip:hover{color:var(--text);border-color:var(--line2)}
  .chip.on{background:var(--accent-dim);border-color:rgba(74,222,128,.45);color:var(--accent);font-weight:600}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .toggle{
    display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
    background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:7px 11px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease;
  }
  .toggle:hover{color:var(--text);border-color:var(--line2)}
  .toggle input{accent-color:var(--accent);width:auto;margin:0}
  #stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .pill{
    font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.035);
    border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap;
  }
  .pill b{color:var(--text);font-weight:650}
  .pill-good b{color:var(--accent)}
  .pill-ai{border-color:rgba(96,165,250,.3)}
  .pill-ai b{color:var(--blue)}
  main{padding:14px 16px 10px;max-width:1680px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
  .card{
    position:relative;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,var(--card),#101420);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
  .thumb{
    aspect-ratio:1/1;background:#0b0e18 center/cover no-repeat;position:relative;
    display:flex;align-items:center;justify-content:center;color:#39405c;font-size:12px;
  }
  .thumb::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 40%,rgba(0,0,0,.14));
  }
  .badge{
    position:absolute;top:8px;left:8px;z-index:2;font-size:11.5px;font-weight:650;
    background:rgba(8,10,16,.8);border:1px solid rgba(255,255,255,.10);border-radius:999px;
    padding:3px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .badge.good{color:var(--accent)} .badge.mid{color:var(--warn)} .badge.bad{color:var(--bad)}
  .body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .title{
    font-size:13px;line-height:1.32;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{display:flex;gap:5px;flex-wrap:wrap}
  .tag{
    font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:7px;padding:2px 6px;white-space:nowrap;
  }
  .tag.fake{color:#fca5a5;background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.30)}
  .tag.orig{color:#86efac;background:rgba(74,222,128,.10);border-color:rgba(74,222,128,.30)}
  .tag.doubt{color:#fcd34d;background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.28)}
  .tag.auth{cursor:pointer;border-style:dashed}
  .tag.auth:hover,.tag.auth:focus-visible{filter:brightness(1.18)}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .est .basis{opacity:.72}
  .more{
    display:block;width:100%;margin:20px 0 8px;padding:13px;font:inherit;font-size:14px;font-weight:600;
    color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:13px;
    cursor:pointer;transition:border-color .15s ease,color .15s ease;
  }
  .more:hover{border-color:rgba(74,222,128,.5);color:var(--accent)}
  .more[hidden]{display:none}
  .reset{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px dashed var(--line2);
         border-radius:11px;padding:7px 11px;cursor:pointer}
  .reset:hover{color:var(--text);border-color:var(--line2)}
  .reset[hidden]{display:none}
  .modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;
         background:rgba(5,7,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .modal[hidden]{display:none}
  .modal-card{
    width:100%;max-width:520px;max-height:82vh;overflow:auto;padding:16px;
    background:#121623;border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .modal-head b{font-size:15px;font-weight:650}
  .modal-head button{
    flex:none;width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);
  }
  .modal-title{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:4px}
  .modal-sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .verdict{display:inline-block;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;margin-bottom:10px}
  .verdict.fake{color:#fca5a5;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.32)}
  .verdict.orig{color:#86efac;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.32)}
  .verdict.doubt{color:#fcd34d;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.30)}
  .verdict.none{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .modal-body ul{margin:6px 0 0;padding-left:18px}
  .modal-body li{margin:4px 0}
  .modal-body .note{color:var(--muted);font-size:11.5px;margin-top:12px;line-height:1.5}
  body.locked{overflow:hidden}
  .price{font-size:17px;font-weight:700;letter-spacing:-.2px;margin-top:auto}
  .est{font-size:11px;color:var(--muted);line-height:1.55}
  a{color:inherit;text-decoration:none}
  .empty{color:var(--muted);text-align:center;padding:48px 12px;font-size:14px}
  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:15;text-align:center;
    padding:9px 14px;font-size:10px;letter-spacing:.12em;color:var(--muted);
    background:rgba(10,12,19,.86);border-top:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  /* подпись в шторке фильтров — только на телефоне */
  .sig{display:none}
  .filter-btn{
    display:none;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;
    transition:border-color .15s ease;
  }
  .filter-btn:hover{border-color:var(--line2)}
  .filters{display:block}
  .filters .head{display:none}
  @media (max-width:700px){
    header{padding:12px 13px 10px}
    h1{font-size:17px}
    .filter-btn{display:inline-block}
    .filters{
      position:fixed;left:0;right:0;top:0;z-index:40;background:#0d1019;
      border-bottom:1px solid var(--line);border-radius:0 0 18px 18px;
      padding:12px 14px 16px;max-height:78vh;overflow-y:auto;
      transform:translateY(-115%);transition:transform .24s ease;
      box-shadow:0 18px 40px rgba(0,0,0,.65);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    }
    .filters.open{transform:translateY(0)}
    .sig{display:block;text-align:center;font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.65;margin:14px 0 2px}
    .filters .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .filters .head b{font-size:15px}
    .filters .head button{
      background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);
      width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
    }
    .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
    .body{padding:9px 10px 11px}
    .price{font-size:16px}
  }
</style>
</head>
<body>
<header>
  <h1>Авито-Финдер <span class="muted" id="city"></span></h1>
  <div class="muted" id="updated"></div>
  <button class="filter-btn" id="filtersBtn">Фильтры</button>

  <div class="filters" id="filters">
    <div class="head"><b>Фильтры</b><button id="filtersClose" aria-label="Закрыть">×</button></div>

    <div class="controls">
    <input class="wide" id="q" type="search" placeholder="Поиск: бренд, вещь, слово">
    <select id="cityFilter"><option value="">Все города</option></select>
    <select id="cat"><option value="">Все категории</option></select>
    <select id="brand"><option value="">Все бренды</option></select>
    <select id="size"><option value="">Все размеры</option></select>
    <select id="sort">
      <option value="discount">Сначала выгодные</option>
      <option value="price">Сначала дешёвые</option>
      <option value="profit">Сначала прибыльные</option>
    </select>
    <input id="pmin" type="number" placeholder="Цена от" value="1000">
    <input id="pmax" type="number" placeholder="Цена до" value="20000">
  </div>

  <div class="chips" id="typeChips" role="group" aria-label="Подлинность">
    <button type="button" class="chip on" data-type="all" aria-pressed="true">Все</button>
    <button type="button" class="chip" data-type="orig" aria-pressed="false">Оригинал</button>
    <button type="button" class="chip" data-type="doubt" aria-pressed="false">Спорные</button>
    <button type="button" class="chip" data-type="fake" aria-pressed="false">Паль</button>
    <button type="button" class="chip" data-type="nobrand" aria-pressed="false">Без бренда</button>
  </div>


  <div class="row">
    <label class="toggle"><input type="checkbox" id="photoOnly" checked> только с фото</label>
    <label class="toggle"><input type="checkbox" id="newOnly"> только новое</label>
    <label class="toggle"><input type="checkbox" id="goodOnly"> только выгодные</label>
    <button type="button" class="reset" id="resetBtn" hidden>сбросить</button>
  </div>
  <div class="sig">Afanasov INC.</div>
  </div>

  <div id="stats"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <button type="button" class="more" id="more" hidden></button>
  <div class="empty" id="empty" hidden>Ничего не найдено — ослабь фильтры</div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <b id="modalTitle">Проверка подлинности</b>
      <button type="button" id="modalClose" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>Afanasov INC.</footer>

<script>
let DATA = __DATA__;

const $ = function (id) { return document.getElementById(id); };
let stateType = 'all';
let MODEL = null;      // медианы по категориям и брендам
let SCORED = [];       // объявления с готовой оценкой подлинности и выгодности
var GOOD_DISCOUNT = 0.35; // скидка, с которой вещь считаем выгодной
var NO_BRAND = 'без бренда'; // так помечаем одежду, у которой бренд не указан

function median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function buildModel(items) {
  var byKey = new Map(), byBrand = new Map(), byCatB = new Map(), byCat = new Map(), all = [];
  function add(map, key, price) {
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(price);
  }
  items.forEach(function (it) {
    var branded = it.brand && it.brand !== NO_BRAND;
    add(byCat, it.category, it.price);
    add(byCat, it.category, it.price);
    if (branded) {
      add(byKey, it.category + '|' + it.brand, it.price);
      add(byBrand, it.brand, it.price);
      add(byCatB, it.category, it.price);
    }
    all.push(it.price);
  });
  return { byKey: byKey, byBrand: byBrand, byCatB: byCatB, byCat: byCat, all: all, allMedian: median(all) };
}

/* оценка подлинности: 0 = явный оригинал, 1 = явное паль */
var FAKE_WORDS = ['паль', 'реплик', 'копи', '1:1', 'аналог', 'люкс качество', 'качество люкс', 'идентичн'];
var ORIG_WORDS = ['оригинал', 'с биркой', 'бирка', 'бирки', 'привез', 'европ', 'сша', 'сток', 'бутик'];

function fakeScore(item, model) {
  // без бренда не бывает «паль»: нечего подделывать. Это отдельная метка, а не приговор
  if (!item.brand || item.brand === NO_BRAND) {
    return { score: 0, label: NO_BRAND, reasons: ['бренд не указан'] };
  }

  var t = (item.title + ' ' + (item.description || '')).toLowerCase();
  var s = 0.40; // брендовая вещь по умолчанию «под вопросом», а не паль
  var reasons = [];

  FAKE_WORDS.forEach(function (w) {
    if (t.indexOf(w) >= 0) { s += 0.30; reasons.push('в тексте «' + w + '»'); }
  });
  ORIG_WORDS.forEach(function (w) {
    if (t.indexOf(w) >= 0) { s -= 0.22; reasons.push('в тексте «' + w + '»'); }
  });

  var group = model.byBrand.get(item.brand) || [];
  if (group.length >= 3) {
    var med = median(group);
    if (item.price < med * 0.40) { s += 0.25; reasons.push('цена ниже 40% медианы бренда'); }
    else if (item.price > med * 1.6) { s -= 0.10; reasons.push('цена выше рынка'); }
  }

  if (item.sellerRating) {
    if (item.sellerRating < 4.5) { s += 0.10; reasons.push('рейтинг продавца ' + item.sellerRating); }
    else if (item.sellerRating >= 4.9) { s -= 0.10; reasons.push('высокий рейтинг продавца'); }
  }

  if (!item.img) { s += 0.05; reasons.push('нет фото'); }
  if (item.size) { s -= 0.03; }

  s = Math.max(0, Math.min(1, s));
  var label = s >= 0.62 ? 'паль' : s <= 0.30 ? 'оригинал' : 'спорно';
  return { score: s, label: label, reasons: reasons };
}

function estimate(item, model, isFake) {
  var branded = item.brand && item.brand !== NO_BRAND;
  var market = 0, basis = 'по всему рынку';

  function pick(list, why) {
    if (list && list.length >= 3) { market = median(list); basis = why; return true; }
    return false;
  }

  if (branded) {
    if (pick(model.byKey.get(item.category + '|' + item.brand), 'по ' + (model.byKey.get(item.category + '|' + item.brand) || []).length + ' похожим')) { }
    else if (pick(model.byBrand.get(item.brand), 'по бренду (' + (model.byBrand.get(item.brand) || []).length + ' шт.)')) { }
    else if (pick(model.byCatB.get(item.category), 'по брендовым в категории')) { }
    else if (pick(model.byCat.get(item.category), 'по категории')) { }
  } else {
    if (pick(model.byCat.get(item.category), 'по категории')) { }
  }
  if (!market) market = model.allMedian * (isFake ? 0.6 : 1);

  return {
    market: Math.round(market),
    discount: market > 0 ? 1 - item.price / market : 0,
    profit: Math.round(market * 0.8 * 0.95 - item.price),
    basis: basis
  };
}

function authLabelOf(item, auth) {
  // у вещи без бренда подделывать нечего — ИИ её тоже не должен записывать в паль
  if (!item.brand || item.brand === NO_BRAND) return NO_BRAND;
  if (item.ai) {
    if (item.ai.verdict === 'original') return 'оригинал';
    if (item.ai.verdict === 'fake') return 'паль';
    return 'спорно';
  }
  return auth.label;
}

function fmt(n) { return n.toLocaleString('ru-RU') + ' ₽'; }

function cardOf(item, est, auth) {
  var a = document.createElement('a');
  a.href = item.url || '#';
  a.target = '_blank';
  a.rel = 'noopener';

  var card = document.createElement('div');
  card.className = 'card';

  var thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (item.img) {
    var im = document.createElement('img');
    im.loading = 'lazy';       // фото грузятся по мере прокрутки, а не все 400 сразу
    im.decoding = 'async';
    im.alt = '';
    im.onerror = function () { im.remove(); thumb.textContent = 'фото не загрузилось'; };
    im.src = item.img;
    thumb.appendChild(im);
  } else {
    thumb.textContent = 'без фото';
  }

  var d = Math.round(est.discount * 100);
  var badge = document.createElement('div');
  badge.className = 'badge ' + (d >= 35 ? 'good' : d >= 20 ? 'mid' : 'bad');
  badge.textContent = (d >= 0 ? '−' : '+') + Math.abs(d) + '% к рынку';
  thumb.appendChild(badge);

  var body = document.createElement('div');
  body.className = 'body';

  var title = document.createElement('div');
  title.className = 'title';
  title.textContent = item.title;

  var meta = document.createElement('div');
  meta.className = 'meta';
  var ai = item.ai;
  var lbl = authLabelOf(item, auth);
  var label = '', labelCls = '', labelTip = '';

  if (lbl === NO_BRAND) {
    labelTip = 'бренд не указан в объявлении';
  } else if (ai) {
    var conf = Math.round((ai.confidence || 0) * 100);
    if (ai.verdict === 'original') { label = 'ИИ: оригинал ' + conf + '%'; labelCls = ' orig'; }
    else if (ai.verdict === 'fake') { label = 'ИИ: паль ' + conf + '%'; labelCls = ' fake'; }
    else { label = 'ИИ не распознал'; labelCls = ' doubt'; }
    labelTip = (ai.reasons || []).join('; ');
  } else {
    label = lbl === 'паль'
      ? 'паль ' + Math.round(auth.score * 100) + '%'
      : lbl === 'оригинал'
        ? 'оригинал ' + Math.round((1 - auth.score) * 100) + '%'
        : 'спорно';
    labelCls = lbl === 'паль' ? ' fake' : lbl === 'оригинал' ? ' orig' : ' doubt';
    labelTip = (auth.reasons || []).join('; ');
  }

  var tags = [
    { text: item.brand, cls: '', tip: lbl === NO_BRAND ? labelTip : '', act: lbl === NO_BRAND },
    { text: item.size, cls: '' },
    { text: item.condition === 'new' ? 'новое' : '', cls: '' },
    { text: item.city, cls: '' }
  ];
  // у вещей без бренда метка уже видна в поле бренда — второй раз не пишем
  if (lbl !== NO_BRAND) tags.push({ text: label, cls: labelCls, tip: labelTip, act: true });

  tags.forEach(function (t) {
    if (!t.text) return;
    var s = document.createElement('span');
    s.className = 'tag' + t.cls;
    s.textContent = t.text;
    if (t.tip) s.title = t.tip;
    if (t.act) {
      s.classList.add('auth');
      s.setAttribute('role', 'button');
      s.setAttribute('tabindex', '0');
      s.setAttribute('aria-label', t.text + ' — почему такой вердикт');
      s.addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation(); openAuth(item, auth);
      });
      s.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault(); ev.stopPropagation(); openAuth(item, auth);
        }
      });
    }
    meta.appendChild(s);
  });

  var price = document.createElement('div');
  price.className = 'price';
  price.textContent = fmt(item.price);

  var estEl = document.createElement('div');
  estEl.className = 'est';
  estEl.title = 'Оценка: медиана похожих объявлений минус 20% на торг и 5% на комиссию. Ориентир, а не гарантия.';
  estEl.innerHTML = 'рынок ≈ <b>' + fmt(est.market) + '</b><br>прибыль: <b style="color:' +
    (est.profit > 0 ? 'var(--accent)' : 'var(--bad)') + '">' + (est.profit > 0 ? '+' : '') + fmt(est.profit) +
    '</b><br><span class="basis">' + est.basis + '</span>';

  body.appendChild(title);
  body.appendChild(meta);
  body.appendChild(price);
  body.appendChild(estEl);
  card.appendChild(thumb);
  card.appendChild(body);
  a.appendChild(card);
  return a;
}

/* ---------- фильтры: показываем только то, что реально есть в базе ---------- */

function readFilters() {
  return {
    q: $('q').value.trim().toLowerCase(),
    city: $('cityFilter').value,
    cat: $('cat').value,
    brand: $('brand').value,
    size: $('size').value,
    pmin: +$('pmin').value || 0,
    pmax: +$('pmax').value || Infinity,
    photoOnly: $('photoOnly').checked,
    newOnly: $('newOnly').checked,
    goodOnly: $('goodOnly').checked
  };
}

// x — объявление вместе с оценкой: { item, auth, est }
// skip — измерение, которое сейчас не учитываем (чтобы выбрать другой вариант в нём же)
function matches(x, f, skip) {
  var it = x.item;
  if (skip !== 'q' && f.q && (it.title + ' ' + it.brand + ' ' + it.category).toLowerCase().indexOf(f.q) < 0) return false;
  if (skip !== 'city' && f.city && it.city !== f.city) return false;
  if (skip !== 'cat' && f.cat && it.category !== f.cat) return false;
  if (skip !== 'brand' && f.brand && it.brand !== f.brand) return false;
  if (skip !== 'size' && f.size && it.size !== f.size) return false;
  if (it.price < f.pmin || it.price > f.pmax) return false;
  if (f.photoOnly && !it.img) return false;
  if (f.newOnly && it.condition !== 'new') return false;
  if (f.goodOnly && Math.round(x.est.discount * 100) < 35) return false;
  var lbl = authLabelOf(it, x.auth);
  if (stateType === 'fake' && lbl !== 'паль') return false;
  if (stateType === 'orig' && lbl !== 'оригинал') return false;
  if (stateType === 'doubt' && lbl !== 'спорно') return false;
  if (stateType === 'nobrand' && lbl !== NO_BRAND) return false;
  return true;
}

// значения, доступные при текущих фильтрах, вместе с количеством (сам фильтр skip не учитываем)
function optionsFor(key, f, skip) {
  var counts = new Map();
  SCORED.forEach(function (x) {
    if (!matches(x, f, skip)) return;
    var v = x.item[key];
    if (v) counts.set(v, (counts.get(v) || 0) + 1);
  });
  return counts;
}

// пересобрать список вариантов; пропавшее значение сбрасывает фильтр в «Все ...»
function setOptions(el, counts, withCount) {
  var current = el.value;
  var values = Array.from(counts.keys());
  values.sort(function (a, b) { return String(a).localeCompare(String(b), 'ru'); });
  while (el.options.length > 1) el.remove(1);
  var frag = document.createDocumentFragment();
  values.forEach(function (v) {
    var o = document.createElement('option');
    o.value = v;
    o.textContent = withCount ? v + ' · ' + counts.get(v) : v;
    frag.appendChild(o);
  });
  el.appendChild(frag);
  el.value = values.indexOf(current) >= 0 ? current : '';
  return el.value;
}

function syncFilters() {
  var f = readFilters();
  // два прохода: после сброса одного фильтра наборы остальных могут расшириться
  for (var pass = 0; pass < 2; pass++) {
    f.cat = setOptions($('cat'), optionsFor('category', f, 'cat'), true);
    f.brand = setOptions($('brand'), optionsFor('brand', f, 'brand'), true);
    f.size = setOptions($('size'), optionsFor('size', f, 'size'), false);
    f.city = setOptions($('cityFilter'), optionsFor('city', f, 'city'), true);
  }
  return readFilters();
}

function rescore() {
  // бренд не указан — пишем это словами, а не «NoName»
  DATA.items.forEach(function (it) {
    if (!it.brand || it.brand === 'NoName') it.brand = NO_BRAND;
  });
  MODEL = buildModel(DATA.items);
  SCORED = DATA.items.map(function (it) {
    var auth = fakeScore(it, MODEL);
    return { item: it, auth: auth, est: estimate(it, MODEL, authLabelOf(it, auth) === 'паль') };
  });
}

/* ---------- вывод карточек порциями ---------- */

var PAGE = 48;
var currentList = [];
var shown = 0;
var FILTERS_KEY = 'avito.filters.v1';
var FILTER_FIELDS = ['q', 'cityFilter', 'cat', 'brand', 'size', 'sort', 'pmin', 'pmax'];
var pendingSelects = null;

function renderChunk() {
  var slice = currentList.slice(shown, shown + PAGE);
  var frag = document.createDocumentFragment();
  slice.forEach(function (x) { frag.appendChild(cardOf(x.item, x.est, x.auth)); });
  $('grid').appendChild(frag);
  shown += slice.length;
  var left = currentList.length - shown;
  var more = $('more');
  more.hidden = left <= 0;
  if (left > 0) more.textContent = 'Показать ещё · осталось ' + left;
}

/* ---------- запоминаем фильтры между визитами ---------- */

function saveFilters() {
  try {
    var o = {};
    FILTER_FIELDS.forEach(function (id) { o[id] = $(id).value; });
    o.photoOnly = $('photoOnly').checked;
    o.newOnly = $('newOnly').checked;
    o.goodOnly = $('goodOnly').checked;
    o.type = stateType;
    localStorage.setItem(FILTERS_KEY, JSON.stringify(o));
  } catch (e) { }
}

function loadFilters() {
  try {
    var o = JSON.parse(localStorage.getItem(FILTERS_KEY) || 'null');
    if (!o) return;
    if (typeof o.q === 'string' && o.q) $('q').value = o.q;
    ['pmin', 'pmax'].forEach(function (id) {
      if (typeof o[id] === 'string') $(id).value = o[id];
    });
    if (typeof o.sort === 'string' && o.sort) $('sort').value = o.sort;
    if (typeof o.photoOnly === 'boolean') $('photoOnly').checked = o.photoOnly;
    if (typeof o.newOnly === 'boolean') $('newOnly').checked = o.newOnly;
    if (typeof o.goodOnly === 'boolean') $('goodOnly').checked = o.goodOnly;
    if (o.type) setStateType(o.type);
    pendingSelects = { cat: o.cat, brand: o.brand, size: o.size, cityFilter: o.cityFilter };
  } catch (e) { }
}

function setStateType(t) {
  stateType = t || 'all';
  Array.prototype.forEach.call(document.querySelectorAll('#typeChips .chip'), function (c) {
    var on = c.dataset.type === stateType;
    c.classList.toggle('on', on);
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function isDirty() {
  return !!($('q').value.trim() || $('cityFilter').value || $('cat').value || $('brand').value || $('size').value ||
    $('sort').value !== 'discount' || $('pmin').value !== '1000' || $('pmax').value !== '20000' ||
    !$('photoOnly').checked || $('newOnly').checked || $('goodOnly').checked || stateType !== 'all');
}

function resetFilters() {
  $('q').value = '';
  $('cat').value = ''; $('brand').value = ''; $('size').value = ''; $('cityFilter').value = '';
  $('sort').value = 'discount';
  $('pmin').value = '1000';
  $('pmax').value = '20000';
  $('photoOnly').checked = true;
  $('newOnly').checked = false;
  $('goodOnly').checked = false;
  setStateType('all');
  apply();
}

function apply(keepShown) {
  var prevShown = keepShown ? shown : 0;
  var f = syncFilters();
  var list = SCORED.filter(function (x) { return matches(x, f); });

  var sort = $('sort').value;
  list.sort(function (a, b) {
    if (sort === 'price') return a.item.price - b.item.price;
    if (sort === 'profit') return b.est.profit - a.est.profit;
    return b.est.discount - a.est.discount;
  });

  currentList = list;
  shown = 0;
  $('grid').textContent = '';
  var target = keepShown ? Math.min(prevShown, list.length) : Math.min(PAGE, list.length);
  if (!target) target = Math.min(PAGE, list.length); // после обновления всегда показываем хотя бы первую порцию
  while (shown < target) renderChunk();

  var good = list.filter(function (x) { return Math.round(x.est.discount * 100) >= 35; }).length;
  var goodFake = list.filter(function (x) {
    return Math.round(x.est.discount * 100) >= 35 && authLabelOf(x.item, x.auth) === 'паль';
  }).length;
  var aiChecked = list.filter(function (x) { return x.item.ai; }).length;
  var noBrand = list.filter(function (x) { return authLabelOf(x.item, x.auth) === NO_BRAND; }).length;
  $('stats').innerHTML =
    '<span class="pill"><b>' + list.length + '</b> найдено</span>' +
    '<span class="pill pill-good"><b>' + good + '</b> выгодных</span>' +
    (goodFake ? '<span class="pill pill-good">из них паль <b>' + goodFake + '</b></span>' : '') +
    (noBrand && stateType !== 'nobrand' ? '<span class="pill">без бренда <b>' + noBrand + '</b></span>' : '') +
    '<span class="pill">медиана <b>' + fmt(Math.round(MODEL ? MODEL.allMedian : 0)) + '</b></span>' +
    (aiChecked ? '<span class="pill pill-ai">ИИ проверил <b>' + aiChecked + '</b></span>' : '');
  $('empty').hidden = list.length > 0;
  $('resetBtn').hidden = !isDirty();
  saveFilters();
}

// перерисовка по вводу с задержкой: иначе на каждую букву заново строятся все карточки
function debounce(fn, ms) {
  var t = null;
  return function () { clearTimeout(t); t = setTimeout(fn, ms); };
}
var applySoon = debounce(apply, 200);

function updateHeader() {
  $('city').textContent = DATA.city || '';
  var dt = new Date(DATA.updated);
  var when = isNaN(dt) ? String(DATA.updated || '')
                       : dt.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' }) + ' МСК';
  $('updated').textContent = 'обновлено: ' + when + ' · ' + DATA.items.length + ' объявлений';
}

/* ---------- окно «почему такой вердикт» ---------- */

function openAuth(item, auth) {
  var lbl = authLabelOf(item, auth);
  var ai = item.ai;
  var body = $('modalBody');
  body.textContent = '';

  var title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = item.title;
  body.appendChild(title);

  var sub = document.createElement('div');
  sub.className = 'modal-sub';
  sub.textContent = [item.brand, fmt(item.price), item.city].filter(Boolean).join(' · ');
  body.appendChild(sub);

  var v = document.createElement('div');
  if (lbl === NO_BRAND) {
    v.className = 'verdict none';
    v.textContent = 'Без бренда';
  } else if (ai) {
    var conf = Math.round((ai.confidence || 0) * 100);
    v.className = 'verdict ' + (ai.verdict === 'fake' ? 'fake' : ai.verdict === 'original' ? 'orig' : 'doubt');
    v.textContent = ai.verdict === 'fake' ? 'ИИ: паль ' + conf + '%'
      : ai.verdict === 'original' ? 'ИИ: оригинал ' + conf + '%'
      : 'ИИ не распознал · ' + conf + '%';
  } else {
    v.className = 'verdict ' + (lbl === 'паль' ? 'fake' : lbl === 'оригинал' ? 'orig' : 'doubt');
    v.textContent = lbl === 'паль' ? 'Паль ' + Math.round(auth.score * 100) + '%'
      : lbl === 'оригинал' ? 'Оригинал ' + Math.round((1 - auth.score) * 100) + '%'
      : 'Спорно';
  }
  body.appendChild(v);

  var why = document.createElement('div');
  if (lbl === NO_BRAND) {
    why.textContent = 'В объявлении не указан бренд, поэтому проверять подлинность нечего. Это не подделка — просто вещь без бренда.';
  } else if (ai) {
    why.textContent = 'Вердикт ИИ' + (ai.model ? ' (' + ai.model + ')' : '') + (ai.at ? ', ' + ai.at : '') + '. Причины:';
  } else {
    why.textContent = 'Проверка без ИИ — по признакам объявления. Причины:';
  }
  body.appendChild(why);

  var reasons = lbl === NO_BRAND ? [] : (ai ? (ai.reasons || []) : (auth.reasons || []));
  if (reasons.length) {
    var ul = document.createElement('ul');
    reasons.forEach(function (r) {
      var li = document.createElement('li');
      li.textContent = r;
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  if (ai && ai.red_flags && ai.red_flags.length) {
    var rf = document.createElement('div');
    rf.className = 'note';
    rf.textContent = 'Красные флаги: ' + ai.red_flags.join('; ');
    body.appendChild(rf);
  }

  var note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Оценка автоматическая и может ошибаться. Самый сильный признак — цена: оригинал дорогого бренда за пару тысяч рублей не продают.';
  body.appendChild(note);

  $('modal').hidden = false;
}

function closeModal() {
  $('modal').hidden = true;
}

function openFilters() {
  $('filters').classList.add('open');
  if (window.matchMedia('(max-width:700px)').matches) document.body.classList.add('locked');
}

function closeFilters() {
  $('filters').classList.remove('open');
  document.body.classList.remove('locked');
}

function init() {
  updateHeader();
  rescore();
  loadFilters();

  var slow = ['q', 'pmin', 'pmax']; // ввод текста и цифр — с задержкой
  ['q', 'cityFilter', 'cat', 'brand', 'size', 'sort', 'pmin', 'pmax', 'photoOnly', 'newOnly', 'goodOnly']
    .forEach(function (id) {
      $(id).addEventListener('input', slow.indexOf(id) >= 0 ? applySoon : function () { apply(); });
    });

  $('filtersBtn').addEventListener('click', openFilters);
  $('filtersClose').addEventListener('click', closeFilters);
  $('resetBtn').addEventListener('click', resetFilters);
  $('more').addEventListener('click', renderChunk);

  Array.prototype.forEach.call(document.querySelectorAll('#typeChips .chip'), function (ch) {
    ch.addEventListener('click', function () {
      setStateType(ch.dataset.type);
      apply();
    });
  });

  $('modalClose').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function (e) {
    if (e.target === $('modal')) closeModal();
  });

  document.addEventListener('click', function (e) {
    if (!$('filters').classList.contains('open')) return;
    if ($('filters').contains(e.target) || $('filtersBtn').contains(e.target)) return;
    closeFilters();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('modal').hidden) closeModal();
    else closeFilters();
  });

  apply();

  // выбранные раньше категорию/бренд/размер/город можно восстановить
  // только после того, как появились варианты в списках
  if (pendingSelects) {
    var changed = false;
    ['cat', 'brand', 'size', 'cityFilter'].forEach(function (id) {
      var v = pendingSelects[id];
      if (!v) return;
      var has = Array.prototype.some.call($(id).options, function (o) { return o.value === v; });
      if (has) { $(id).value = v; changed = true; }
    });
    pendingSelects = null;
    if (changed) apply();
  }
}

/* ---------- автообновление: подхватываем новый каталог без перезагрузки ---------- */

var REFRESH_EVERY = 120000; // раз в 2 минуты
var pulling = false;

function pullFresh() {
  if (pulling || typeof fetch !== 'function' || location.protocol === 'file:') return;
  pulling = true;
  fetch('data.json?ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (fresh) {
      if (!fresh || !fresh.items || !fresh.items.length) return;
      // обновление каталога определяем и по времени, и по числу объявлений
      if (String(fresh.updated) === String(DATA.updated) && fresh.items.length === DATA.items.length) return;
      DATA = fresh;
      rescore();
      updateHeader();
      apply(true); // фильтры пересоберутся, пропавшие значения сбросятся в «Все ...», порция карточек сохранится
    })
    .catch(function () { })
    .then(function () { pulling = false; });
}

// при открытии пробуем взять свежие данные; если сети нет — остаёмся на вшитых
function startApp() {
  if (typeof fetch !== 'function' || location.protocol === 'file:') {
    init();
    return;
  }
  fetch('data.json?ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (fresh) {
      if (fresh && fresh.items && fresh.items.length) DATA = fresh;
    })
    .catch(function () { })
    .then(function () {
      init();
      setInterval(function () { if (!document.hidden) pullFresh(); }, REFRESH_EVERY);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) pullFresh();
      });
    });
}

startApp();
</script>
